[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "embracer-bachelor-etl"
version = "0.1.0"
description = "Portfolio-safe game metadata normalization and entity-resolution pipeline."
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "PyYAML==6.0.2",
    "requests==2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
